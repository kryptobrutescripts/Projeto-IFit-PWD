{% extends "base.html" %}
{% block title %}iFit+ - Nova Atividade{% endblock %}
{% block content %}
{% include "components/navbar.html" %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header"><h3>Nova Atividade</h3></div>
    <div class="card-body">
        <form action="{{ url_for('add_activity') }}" method="POST">
            <div class="form-group"><label>Categoria</label><select name="category" class="form-control" required><option value="">Selecione</option>{% for key, value in CATEGORIES.items() %}<option value="{{ key }}">{{ value['name'] }}</option>{% endfor %}</select></div>
            <div class="form-group"><label>Data</label><input type="date" name="date" class="form-control" value="{{ datetime.now().strftime('%Y-%m-%d') if datetime else '' }}" required></div>
            <div class="form-group"><label>Distância (km)</label><input type="number" name="distance" class="form-control" step="0.1" min="0.1" placeholder="Ex: 5.0" required></div>
            <div class="form-group"><label>Duração (min)</label><input type="number" name="duration" class="form-control" min="1" placeholder="Ex: 30" required></div>
            <div style="display:flex;gap:10px;"><button type="submit" class="btn btn-primary" style="flex:1;">Salvar</button><a href="{{ url_for('home') }}" class="btn btn-cancel" style="flex:1;text-align:center;">Cancelar</a></div>
        </form>
    </div>
</div>
{% endblock %}
