{% extends "base.html" %}
{% block title %}iFit+ - Criar Conta{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 50px auto;">
    <div class="card-header" style="text-align: center;">
        <h2>iFit+</h2>
    </div>
    <div class="card-body">
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
                <label>Nome de Usuário</label>
                <input type="text" name="username" class="form-control" required>
                <small style="display: block; color: var(--text-muted); margin-top: 4px; font-size: 12px;">Apenas letras minúsculas, números e underline. 3-20 caracteres.</small>
            </div>
            <div class="form-group">
                <label>Nome de Exibição</label>
                <input type="text" name="display_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Data de Nascimento</label>
                <input type="date" name="birth_date" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Gênero</label>
                <select name="gender" class="form-control" required>
                    <option value="">Selecione</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" class="form-control" placeholder="********" required>
                <small style="display: block; color: var(--text-muted); margin-top: 4px; font-size: 12px;">A senha deve ter pelo menos 8 caracteres</small>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%">Registrar</button>
        </form>
        <a href="{{ url_for('login') }}" class="nav-link" style="display: block; text-align: center; margin-top: 16px;">Já tenho conta</a>
    </div>
</div>
{% endblock %}
