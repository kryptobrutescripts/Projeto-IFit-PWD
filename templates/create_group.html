{% extends "base.html" %}
{% block title %}iFit+ - Criar Grupo{% endblock %}
{% block content %}
{% include "components/navbar.html" %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <div class="card-header">
        <h3>Criar Grupo</h3>
        <a href="{{ url_for('painel_grupos') }}" class="nav-link">← Voltar</a>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="form-group">
                <label>Nome do Grupo</label>
                <input type="text" name="name" class="form-control" placeholder="Ex: Corredores de Domingo" required>
            </div>
            <div class="form-group">
                <label>Descrição</label>
                <textarea name="description" class="form-control" rows="3" placeholder="Descrição do grupo (opcional)"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">
                Criar
            </button>
        </form>
    </div>
</div>
{% endblock %}
